<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE DRIVE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #0009}
.top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:20px;font-weight:900;letter-spacing:.16em}.brand small{display:block;font-size:10px;letter-spacing:.28em;color:#9fb8d3;font-weight:600}
.panel{background:#071522b8;border:1px solid #ffffff2b;border-radius:12px;padding:10px 14px;backdrop-filter:blur(10px)}
#speed{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}#speed small{font-size:11px;color:#a9c4da}
.bottom{position:absolute;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;gap:10px}
#help{font-size:12px;line-height:1.8;color:#d3e2f0}#carName{font-weight:800;font-size:14px}
#toast{position:absolute;top:85px;left:50%;transform:translateX(-50%);font-size:13px;color:#eaf6ff;background:#071522cc;padding:9px 15px;border:1px solid #ffffff33;border-radius:20px;opacity:0;transition:opacity .25s}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#06101bdc,#07182ad9);color:white;z-index:5}
.card{width:min(560px,calc(100% - 32px));padding:28px;border:1px solid #ffffff35;border-radius:20px;background:#0b1b2beF;box-shadow:0 24px 90px #0008}
h1{margin:0;font-size:clamp(36px,8vw,64px);letter-spacing:.12em} .sub{color:#9db7cf;letter-spacing:.24em;font-size:11px;margin:0 0 20px}
.desc{color:#d4e2ef;line-height:1.8;font-size:14px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:800;color:#07111e;background:linear-gradient(135deg,#b9f1ff,#69c7f4);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px} .secondary{background:#1b3044;color:#eaf6ff;border:1px solid #ffffff28}
#touch{position:absolute;bottom:90px;left:18px;right:18px;display:none;justify-content:space-between;pointer-events:auto}
.pad{display:flex;gap:8px}.touchbtn{width:54px;height:54px;padding:0;border-radius:50%;background:#0a1c2bbd;color:white;border:1px solid #ffffff55;touch-action:none}
@media(max-width:700px){#help{display:none}#touch{display:flex}.top{top:10px;left:10px;right:10px}.bottom{left:10px;right:10px;bottom:12px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="menu"><div class="card">
<h1>FREE DRIVE</h1><p class="sub">DRIVE YOUR OWN WORLD</p>
<p class="desc">広い街と自然の中を、好きな方向へ自由に走ろう。まずはオープンワールド試作版！<br>車種変更・視点切替・自由走行ができるよ。</p>
<div class="row"><button id="start">ドライブ開始</button><button class="secondary" id="how">操作方法</button></div>
<p id="howText" class="desc" hidden>WASD / 矢印：運転　C：視点切替　1〜3：車変更　R：リセット　Space：ブレーキ</p>
</div></div>
<div id="hud">
 <div class="top"><div class="brand">FREE DRIVE<small>OPEN WORLD • PROTOTYPE 01</small></div><div class="panel"><div id="speed">000 <small>KM/H</small></div><div id="carName">CITY SPORT</div></div></div>
 <div id="toast"></div>
 <div class="bottom"><div class="panel" id="help">WASD / ↑↓←→　運転<br>C　視点切替　　1〜3　車変更<br>R　スタート地点へ戻る　　Space　ブレーキ</div><div class="panel">自由走行エリア <b>01</b></div></div>
 <div id="touch"><div class="pad"><button class="touchbtn" data-key="a">◀</button><button class="touchbtn" data-key="d">▶</button></div><div class="pad"><button class="touchbtn" data-key="w">▲</button><button class="touchbtn" data-key="s">▼</button></div></div>
</div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9d8);scene.fog=new THREE.Fog(0x87b9d8,180,650);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x52634b,2.1));
const sun=new THREE.DirectionalLight(0xfff0d6,2.7);sun.position.set(-90,150,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1100,1100),mat(0x64845c));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const asphaltCanvas=document.createElement('canvas');asphaltCanvas.width=asphaltCanvas.height=512;const ac=asphaltCanvas.getContext('2d');ac.fillStyle='#30343a';ac.fillRect(0,0,512,512);for(let i=0;i<18000;i++){const v=70+Math.random()*65;ac.fillStyle='rgba('+v+','+v+','+v+',0.22)';ac.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*2)}const asphaltTex=new THREE.CanvasTexture(asphaltCanvas);asphaltTex.wrapS=asphaltTex.wrapT=THREE.RepeatWrapping;asphaltTex.repeat.set(8,2);asphaltTex.colorSpace=THREE.SRGBColorSpace;
const roadMat=new THREE.MeshStandardMaterial({color:0x8b9299,map:asphaltTex,roughness:.92}),lineMat=mat(0xf5f0df),sideMat=mat(0xb7b8ad);
function road(x,z,w,d){box(w,.12,d,roadMat,x,0,z);if(w>d){for(let p=-w/2+8;p<w/2-4;p+=13)box(5,.025,.22,lineMat,x+p,.071,z)}else{for(let p=-d/2+8;p<d/2-4;p+=13)box(.22,.025,5,lineMat,x,.071,z+p)}}
road(0,0,620,18);road(0,0,18,620);road(0,-150,360,14);road(0,150,360,14);road(-150,0,14,360);road(150,0,14,360);
for(const [x,z,w,d] of [[0,-300,620,12],[0,300,620,12],[-300,0,12,620],[300,0,12,620]])box(w,.1,d,sideMat,x,-.01,z);
const buildingM=[0x8fa2b2,0xc2b9a5,0x657e91,0xd1d5d0,0x9caa9a].map(c=>mat(c));
// Street furniture and illuminated city details
const poleMat=mat(0x303b45,.35,.65),glowMat=new THREE.MeshStandardMaterial({color:0xffe7b2,emissive:0xffc76b,emissiveIntensity:2.5});
for(let side of [-1,1])for(let z=-270;z<=270;z+=45){const x=side*16;box(.22,7,.22,poleMat,x,3.5,z);box(2.8,.16,.18,poleMat,x+side*1.25,6.8,z);box(.8,.12,.35,glowMat,x+side*2.25,6.65,z)}
for(let i=0;i<105;i++){let x=(Math.random()-.5)*520,z=(Math.random()-.5)*520;if(Math.abs(x)<35||Math.abs(z)<35)continue;let w=10+Math.random()*17,d=10+Math.random()*17,h=12+Math.random()*55;const facade=new THREE.MeshPhysicalMaterial({color:buildingM[i%buildingM.length].color,roughness:.48,metalness:.18});const b=box(w,h,d,facade,x,h/2,z);if(Math.random()>.45){for(let y=5;y<h-3;y+=5)for(let xx=-w/2+2;xx<w/2-1;xx+=4){const win=new THREE.MeshStandardMaterial({color:0x9ed8e8,emissive:0x31596c,emissiveIntensity:.35,roughness:.25,metalness:.25});box(.9,1.4,.08,win,x+xx,y,z+d/2+.05,b)}}}
const treeM=mat(0x315d3c),trunkM=mat(0x604632);
for(let i=0;i<180;i++){let x=(Math.random()-.5)*850,z=(Math.random()-.5)*850;if(Math.abs(x)<330&&Math.abs(z)<330)continue;let h=3+Math.random()*5;box(.7,h*.55,.7,trunkM,x,h*.275,z);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(h*.48,1),treeM);crown.position.set(x,h*.85,z);crown.castShadow=true;scene.add(crown)}
// distant hills
for(let i=0;i<36;i++){let a=i/36*Math.PI*2,r=430+Math.random()*80,h=35+Math.random()*55;const hill=new THREE.Mesh(new THREE.ConeGeometry(55+Math.random()*40,h,7),mat(0x58765d));hill.position.set(Math.cos(a)*r,h/2-4,Math.sin(a)*r);scene.add(hill)}
const carDefs=[{name:'CITY SPORT',color:0x16b9e9,power:32,max:62,shape:'sport'},{name:'RALLY X',color:0xe8a12b,power:27,max:55,shape:'rally'},{name:'FUTURE GT',color:0x9b7cff,power:38,max:72,shape:'future'}];
let carIndex=0,car=new THREE.Group(),speed=0,heading=0,third=true;
function buildCar(def){
 const g=new THREE.Group();
 const body=new THREE.MeshPhysicalMaterial({color:def.color,roughness:.17,metalness:.68,clearcoat:1,clearcoatRoughness:.055});
 const carbon=new THREE.MeshStandardMaterial({color:0x111820,roughness:.42,metalness:.48});
 const glass=new THREE.MeshPhysicalMaterial({color:0x071b2b,roughness:.12,metalness:.35,clearcoat:1,clearcoatRoughness:.04});
 const chrome=new THREE.MeshStandardMaterial({color:0xaab8c5,roughness:.2,metalness:.92});
 const led=new THREE.MeshStandardMaterial({color:0xe8fbff,emissive:0x9deaff,emissiveIntensity:2.8});
 const redLed=new THREE.MeshStandardMaterial({color:0xff3028,emissive:0xff140c,emissiveIntensity:2.2});
 function loft(sections,material,segments=16){
  const positions=[],indices=[];
  sections.forEach(s=>{for(let j=0;j<segments;j++){const a=j/segments*Math.PI*2;positions.push(Math.cos(a)*s.w,s.cy+Math.sin(a)*s.h,s.z)}});
  for(let i=0;i<sections.length-1;i++)for(let j=0;j<segments;j++){const a=i*segments+j,b=i*segments+(j+1)%segments,c=(i+1)*segments+(j+1)%segments,d=(i+1)*segments+j;indices.push(a,b,d,b,c,d)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setIndex(indices);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,material);mesh.castShadow=true;mesh.receiveShadow=true;g.add(mesh);return mesh;
 }
 // Low, wide, sculpted one-piece supercar body: pointed nose and muscular rear haunches.
 loft([
  {z:2.42,w:.62,cy:.57,h:.20},{z:2.12,w:.88,cy:.59,h:.27},
  {z:1.45,w:1.02,cy:.61,h:.31},{z:.25,w:1.08,cy:.62,h:.34},
  {z:-1.25,w:1.12,cy:.64,h:.36},{z:-2.05,w:1.03,cy:.62,h:.31},
  {z:-2.32,w:.82,cy:.58,h:.22}
 ],body,24);
 // Dark panoramic cockpit with a sloping windscreen and fastback roof.
 loft([
  {z:1.18,w:.67,cy:1.00,h:.12},{z:.72,w:.78,cy:1.19,h:.34},
  {z:.22,w:.73,cy:1.27,h:.39},{z:-.72,w:.70,cy:1.27,h:.38},
  {z:-1.42,w:.91,cy:1.02,h:.15}
 ],glass,20);
 // Painted roof spine and rear deck details.
 const roof= new THREE.Mesh(new THREE.BoxGeometry(1.05,.055,.78),body);roof.position.set(0,1.65,-.28);g.add(roof);
 // Wide front splitter, rear diffuser, side skirts and aerodynamic blades.
 const splitter=new THREE.Mesh(new THREE.BoxGeometry(2.05,.09,.42),carbon);splitter.position.set(0,.38,2.18);g.add(splitter);
 const diffuser=new THREE.Mesh(new THREE.BoxGeometry(1.72,.16,.42),carbon);diffuser.position.set(0,.39,-2.13);g.add(diffuser);
 for(const x of [-1,1]){
  const skirt=new THREE.Mesh(new THREE.BoxGeometry(.16,.22,2.35),carbon);skirt.position.set(x,.48,-.02);g.add(skirt);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(.07,.22,.72),body);fin.position.set(x*.88,.88,-1.72);g.add(fin);
  // Side intake behind the front wheel.
  const intake=new THREE.Mesh(new THREE.BoxGeometry(.035,.28,.62),carbon);intake.position.set(x*1.055,.72,-.55);g.add(intake);
  const intakeLine=new THREE.Mesh(new THREE.BoxGeometry(.045,.035,.48),chrome);intakeLine.position.set(x*1.078,.82,-.55);g.add(intakeLine);
 }
 // Detailed wheels, metallic multi-spoke rims and brake discs.
 for(const x of [-1.06,1.06])for(const z of [-1.43,1.42]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.30,32),carbon);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.49,z);wheel.castShadow=true;g.add(wheel);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.315,32),chrome);rim.rotation.z=Math.PI/2;rim.position.set(x*1.005,.49,z);g.add(rim);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(.235,.235,.32,24),mat(0x424d58,.32,.8));disc.rotation.z=Math.PI/2;disc.position.set(x*1.01,.49,z);g.add(disc);
  for(let k=0;k<5;k++){const spoke=new THREE.Mesh(new THREE.BoxGeometry(.035,.045,.52),chrome);spoke.position.set(x*1.02,.49,z);spoke.rotation.x=k*Math.PI/5;spoke.rotation.y=.0;g.add(spoke)}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.34,20),carbon);hub.rotation.z=Math.PI/2;hub.position.set(x*1.025,.49,z);g.add(hub);
 }
 // Thin swept LED headlights and full-width rear light bar.
 for(const side of [-1,1]){
  const head=new THREE.Mesh(new THREE.BoxGeometry(.58,.075,.12),led);head.position.set(side*.68,.72,2.12);head.rotation.y=-side*.16;g.add(head);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.72,.09,.09),redLed);tail.position.set(side*.53,.72,-2.27);g.add(tail);
 }
 const rearBar=new THREE.Mesh(new THREE.BoxGeometry(1.15,.055,.08),redLed);rearBar.position.set(0,.75,-2.29);g.add(rearBar);
 // Rear wing, supports and twin exhausts.
 const wing=new THREE.Mesh(new THREE.BoxGeometry(2.05,.12,.42),body);wing.position.set(0,1.32,-2.12);g.add(wing);
 for(const x of [-.68,.68]){const support=new THREE.Mesh(new THREE.BoxGeometry(.07,.48,.1),carbon);support.position.set(x,1.08,-2.05);g.add(support)}
 for(const x of [-.48,.48]){const exhaust=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.16,16),chrome);exhaust.rotation.x=Math.PI/2;exhaust.position.set(x,.48,-2.34);g.add(exhaust)}
 // Distinct silhouettes for the three original models.
 if(def.shape==='rally'){
  const roofBar=new THREE.Mesh(new THREE.BoxGeometry(1.55,.09,.12),carbon);roofBar.position.set(0,1.69,-.45);g.add(roofBar);
  for(const x of [-.78,.78]){const flare=new THREE.Mesh(new THREE.BoxGeometry(.18,.32,1.45),body);flare.position.set(x,.68,-.02);g.add(flare)}
  const rallyWing=new THREE.Mesh(new THREE.BoxGeometry(2.25,.13,.48),carbon);rallyWing.position.set(0,1.62,-2.1);g.add(rallyWing);
 }else if(def.shape==='future'){
  const canopyGlow=new THREE.Mesh(new THREE.BoxGeometry(.045,.55,1.9),new THREE.MeshStandardMaterial({color:0x7deaff,emissive:0x27cfff,emissiveIntensity:2.2}));canopyGlow.position.set(0,1.3,-.05);g.add(canopyGlow);
  const rearBlade=new THREE.Mesh(new THREE.BoxGeometry(2.25,.08,.18),chrome);rearBlade.position.set(0,1.42,-2.18);g.add(rearBlade);
 }
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return g;
}
function setCar(i){carIndex=(i+3)%3;if(car.parent)scene.remove(car);car=buildCar(carDefs[carIndex]);scene.add(car);document.querySelector('#carName').textContent=carDefs[carIndex].name;toast('車を変更：'+carDefs[carIndex].name)}
setCar(0);car.position.set(0,0,0);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='c'){third=!third;toast(third?'三人称視点':'一人称視点')}if(e.key.toLowerCase()==='r'){car.position.set(0,0,0);heading=0;speed=0}if(['1','2','3'].includes(e.key))setCar(Number(e.key)-1)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.touchbtn').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1500)}
document.querySelector('#start').onclick=()=>document.querySelector('#menu').style.display='none';
document.querySelector('#how').onclick=()=>{const h=document.querySelector('#howText');h.hidden=!h.hidden};
const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),lookTarget=new THREE.Vector3();
function update(dt){const def=carDefs[carIndex],forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,brake=keys[' '];
if(forward)speed+=def.power*dt;else if(back)speed-=def.power*dt*.8;else speed*=Math.pow(.985,dt*60);if(brake)speed*=Math.pow(.91,dt*60);speed=THREE.MathUtils.clamp(speed,-18,def.max);
const steer=(left?1:0)-(right?1:0);heading+=steer*dt*(.75+Math.min(Math.abs(speed)/24,1.5))*Math.sign(speed||1);
car.rotation.y=heading;car.position.x+=Math.sin(heading)*speed*dt;car.position.z+=Math.cos(heading)*speed*dt;car.position.y=0;
const fwd=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
if(third){camTarget.copy(car.position).addScaledVector(fwd,-10);camTarget.y+=5.2;lookTarget.copy(car.position);lookTarget.y+=1.2}else{camTarget.copy(car.position);camTarget.y+=1.65;camTarget.addScaledVector(fwd,1.4);lookTarget.copy(camTarget).addScaledVector(fwd,18)}
camera.fov=THREE.MathUtils.lerp(camera.fov,65+Math.min(Math.abs(speed)*.18,9),1-Math.pow(.02,dt));camera.updateProjectionMatrix();camera.position.lerp(camTarget,1-Math.pow(.001,dt));camera.lookAt(lookTarget);
document.querySelector('#speed').innerHTML=String(Math.round(Math.abs(speed)*3.6)).padStart(3,'0')+' <small>KM/H</small>';
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
